# ==========================================================================
# NEPON — Nginx Reverse Proxy Configuration
# Routes:
#   /api/*  → Node.js backend (port 5000)
#   /ml/*   → Python AI engine (port 8000)
#   /*      → Next.js frontend  (port 3000)
# ==========================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;

    keepalive_timeout  65;
    client_max_body_size 10m;

    # Security headers
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css text/xml;
    gzip_min_length 256;

    upstream backend {
        server backend:5000;
    }

    upstream ai_engine {
        server ai-engine:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # API routes → Node.js backend
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-running requests (checkout, etc.)
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # ML routes → Python AI engine (internal, proxied through backend in prod,
        # but directly accessible via Nginx for health checks and docs)
        location /ml/ {
            proxy_pass http://ai_engine;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Everything else → Next.js frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade         $http_upgrade;
            proxy_set_header Connection      "upgrade";
        }
    }
}
