# ==========================================================================
# NEPON — Docker Compose Orchestration
# Runs all services: Frontend, Backend, AI Engine, MongoDB, Redis
# ==========================================================================

services:
  # ---------- MongoDB ----------
  mongo:
    image: mongo:7
    container_name: nepon-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: nepon
    networks:
      - nepon-net

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: nepon-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - nepon-net

  # ---------- Backend (Node.js/Express) ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nepon-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/nepon
      - REDIS_URL=redis://redis:6379
      - AI_ENGINE_URL=http://ai-engine:8000
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - mongo
      - redis
    networks:
      - nepon-net

  # ---------- AI Engine (Python/FastAPI) ----------
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: nepon-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/nepon
      - AI_ENGINE_PORT=8000
      - MODEL_DIR=/app/model_store
    volumes:
      - ai_models:/app/model_store
    depends_on:
      - mongo
    networks:
      - nepon-net

  # ---------- Frontend (Next.js) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nepon-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - nepon-net

  # ---------- Nginx Reverse Proxy ----------
  nginx:
    image: nginx:alpine
    container_name: nepon-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - ai-engine
    networks:
      - nepon-net

volumes:
  mongo_data:
  ai_models:

networks:
  nepon-net:
    driver: bridge
